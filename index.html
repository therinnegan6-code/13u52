<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAW GAME - High Performance</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #090c10; color: #c9d1d9;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #brand {
    display: flex; align-items: center; justify-content: center;
    padding: 10px 14px; background: #0d1117;
    border-bottom: 1px solid #21262d;
  }
  #brand img {
    width: 26px; height: 26px; margin-right: 8px; border-radius: 50%;
  }
  #brand b {
    font-size: 15px; font-weight: 700; letter-spacing: .12em;
    color: #f0f6fc;
  }
  #brand .badge {
    margin-left: 8px; padding: 2px 7px;
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    border-radius: 12px; background: rgba(56, 139, 253, 0.15);
    color: #58a6ff; border: 1px solid rgba(56, 139, 253, 0.3);
  }
  #wrap {
    max-width: 680px; margin: 0 auto; padding: 20px 18px;
    display: flex; flex-direction: column; align-items: center;
  }
  #card {
    width: 100%; background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 18px 20px; margin-top: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  #state {
    font-size: 18px; font-weight: 700; margin: 0 0 8px;
    color: #f0f6fc; display: flex; align-items: center; justify-content: space-between;
  }
  #det {
    font-size: 13px; color: #8b949e; margin: 0 0 6px;
  }
  #det b { color: #c9d1d9; font-weight: 600; }
  #cache {
    font-size: 12px; color: #6e7681; margin: 0 0 14px; min-height: 14px;
  }
  #cache.cacheok { color: #3fb950; font-weight: 600; }

  /* High performance animated progress indicator */
  #spin-box {
    position: relative; width: 64px; height: 64px; margin: 18px auto 14px;
    display: flex; align-items: center; justify-content: center;
  }
  #spin {
    width: 54px; height: 54px;
    border: 4px solid #21262d; border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #msg {
    text-align: center; font-size: 15px; font-weight: 600;
    margin: 8px 0; color: #8b949e;
  }

  /* Micro milestones */
  #milestones {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid #21262d; font-size: 12px;
  }
  .ms-item {
    padding: 6px 10px; background: #0d1117; border-radius: 6px;
    border: 1px solid #21262d; color: #8b949e; display: flex; align-items: center;
  }
  .ms-item.ms-done { border-color: #238636; color: #3fb950; font-weight: 600; }
  .ms-item.ms-active { border-color: #388bfd; color: #58a6ff; font-weight: 600; }
  .ms-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #6e7681; margin-right: 8px;
  }
  .ms-done .ms-dot { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .ms-active .ms-dot { background: #58a6ff; box-shadow: 0 0 6px #58a6ff; }

  /* Body states */
  body.done #spin { display: none; }
  body.fail #spin { display: none; }
  body.done #msg {
    display: block; color: #3fb950; font-weight: 700; font-size: 18px;
    letter-spacing: 1.5px;
  }
  body.fail #msg { display: block; color: #f85149; font-weight: 700; }

  /* ?log=1 Diagnostics output */
  #out {
    display: none; width: 100%; white-space: pre-wrap;
    font: 12px/1.45 Consolas, Monaco, monospace;
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; padding: 12px; margin-top: 14px;
    max-height: 520px; overflow-y: auto; color: #c9d1d9;
  }
  body.log #out { display: block; }
  body.log #spin-box { display: none; }
  body.log #msg { display: none; }
  body.log #card { max-width: 100%; }

  .ok { color: #3fb950; }
  .bad { color: #f85149; }
  .warn { color: #d29922; }
  .safe { color: #3fb950; }
  .danger { color: #f85149; }
</style>
</head>
<body>
<div id="brand">
  <img src="logo_raw.png" alt="" width="26" height="26">
  <b>RAW GAME</b>
  <span class="badge">ULTRA FAST</span>
</div>

<div id="wrap">
  <div id="card">
    <div id="state">Detecting Firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>

    <div id="spin-box">
      <div id="spin"></div>
    </div>
    <div id="msg">Preparing environment...</div>

    <div id="milestones">
      <div id="ms-fw" class="ms-item"><span class="ms-dot"></span>Console Check</div>
      <div id="ms-prim" class="ms-item"><span class="ms-dot"></span>WebKit Memory Primitive</div>
      <div id="ms-pivot" class="ms-item"><span class="ms-dot"></span>Dual Worker Pipeline</div>
      <div id="ms-pl" class="ms-item"><span class="ms-dot"></span>GoldHEN Injected</div>
    </div>

    <div id="out"></div>
  </div>
</div>

<script>
// Prevent immediate auto-run on script parse so index.html can orchestrate 0-redirect startup
window.MANUAL_LAUNCH = true;
</script>
<script src="jb.bundle.js"></script>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var msgEl = document.getElementById("msg");
    var msFw = document.getElementById("ms-fw");
    var msPrim = document.getElementById("ms-prim");
    var msPivot = document.getElementById("ms-pivot");
    var msPl = document.getElementById("ms-pl");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares with measured kernel table: 13.02, 13.04, 13.50, 13.52
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "Firmware: <b>" + (key || "Desktop / Other") + "</b>"
        + (supported ? " &middot; <span class='ok'>Supported</span>"
                     : " &middot; <span class='warn'>Not in kernel table</span>");

    if (supported && msFw) msFw.className = "ms-item ms-done";

    var launched = false;
    function startNow() {
        if (launched) return;
        launched = true;
        setState("Executing GoldHEN...", "warn");
        if (msgEl) msgEl.textContent = "Activating payload...";
        if (msPrim) msPrim.className = "ms-item ms-active";
        // ZERO REDIRECT: run directly in-context!
        if (window.startJailbreak) {
            window.startJailbreak();
        }
    }

    function waitForTap(msgText, action) {
        setState(msgText, "warn");
        if (msgEl) msgEl.textContent = "Press X or tap screen to launch";
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Auto-update milestones based on body classes or log marks
    var observer = new MutationObserver(function() {
        if (document.body.classList.contains("done")) {
            if (msPrim) msPrim.className = "ms-item ms-done";
            if (msPivot) msPivot.className = "ms-item ms-done";
            if (msPl) msPl.className = "ms-item ms-done";
            setState("GoldHEN Active", "ok");
            if (msgEl) msgEl.textContent = "DONE • GoldHEN Ready (Port 9090 / 2121)";
        } else if (document.body.classList.contains("fail")) {
            setState("Exploit Failed", "bad");
            if (msgEl) msgEl.textContent = "Reboot console and retry";
        }
    });
    observer.observe(document.body, { attributes: true, attributeFilter: ["class"] });

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ")", startNow);
        return;
    }

    // High performance AppCache orchestrator
    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        startNow();
    } else if (!navigator.onLine) {
        setCache("Offline - Instant Load from Cache", true);
        startNow();
    } else if (ac.status === ac.IDLE) {
        setCache("Cached (0ms Network Overhead)", true);
        startNow();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("Update Available", true);
        location.reload();
    } else {
        setCache("Checking AppCache...");
        ac.addEventListener("downloading", function () {
            setCache("Caching assets for offline use (1st run)...");
        }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("Caching assets: " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("Cached for offline use", true);
            startNow();
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("Cache Verified (Instant)", true);
            startNow();
        }, false);
        ac.addEventListener("error", function () {
            setCache("Offline / Cache Ready", true);
            startNow();
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            location.reload();
        }, false);
    }
})();
</script>
</body>
</html>
